[project]
name = "mcp-openapi"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server that fronts any OpenAPI service: discover operations from its spec and call them, with bearer tokens supplied by pluggable helper commands."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Joh X", email = "alyiox@hotmail.com" }
]
maintainers = [
    { name = "Joh X", email = "alyiox@hotmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "openapi",
    "swagger",
    "rest",
    "api",
    "llm",
    "agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.13"
dependencies = [
    "filelock>=3.30",
    "httpx>=0.27",
    "mcp[cli]>=2.0.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/alyiox/mcp-openapi"
Repository = "https://github.com/alyiox/mcp-openapi.git"
Issues = "https://github.com/alyiox/mcp-openapi/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "anyio>=4.0",
    "ruff>=0.15",
    "pyright>=1.1",
    "pre-commit>=4.0",
]

[project.scripts]
mcp-openapi = "mcp_openapi.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_openapi"]

[tool.uv]
managed = true

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [".git", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
strict_markers = true
asyncio_mode = "auto"
