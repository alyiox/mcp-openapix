name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - name: Version consistency
        run: |
          pkg=$(uv version --short)
          bad=$(jq -r --arg v "$pkg" \
            '[.version, .packages[].version] | map(select(. != $v)) | join(", ")' server.json)
          [ -z "$bad" ] || {
            echo "::error file=server.json::version $bad does not match package $pkg"
            exit 1
          }
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "$pkg" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match package version $pkg"
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint and format
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest tests/ -v --tb=short

  publish:
    name: Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mcp-openapix/${{ github.ref_name }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - name: Build Python package distributions
        run: uv build

      - name: Publish Python package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Install MCP Registry publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate MCP Registry publisher
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata to MCP Registry
        run: ./mcp-publisher publish
